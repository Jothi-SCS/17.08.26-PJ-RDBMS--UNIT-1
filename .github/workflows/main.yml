name: CollegeDB Autograding

on:
  push:
  pull_request:

jobs:
  autograding:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Oracle Database
        run: |
          docker run -d \
            --name oracle-db \
            -p 1521:1521 \
            -e ORACLE_PASSWORD=Oracle123 \
            gvenzl/oracle-free:23-slim-faststart

      - name: Wait for Oracle
        run: |
          for i in {1..60}; do
            if docker logs oracle-db 2>&1 | grep -q "DATABASE IS READY TO USE"; then
              echo "Oracle is ready"
              break
            fi
            sleep 5
          done

      - name: Create CollegeDB User
        run: |
          docker exec oracle-db bash -c "
          echo \"
          ALTER SESSION SET CONTAINER=FREEPDB1;
          CREATE USER collegeDB IDENTIFIED BY CollegeDB123;
          GRANT CONNECT, RESOURCE, CREATE SESSION,
                CREATE TABLE, CREATE VIEW,
                CREATE SEQUENCE, CREATE TRIGGER
          TO collegeDB;
          ALTER USER collegeDB QUOTA UNLIMITED ON USERS;
          EXIT;
          \" | sqlplus -s system/Oracle123@FREEPDB1
          "

      - name: Copy Assignment Files
        run: |
          docker exec oracle-db mkdir -p /assignment/Program1
          docker exec oracle-db mkdir -p /assignment/Program2
          docker exec oracle-db mkdir -p /assignment/Program3
          docker exec oracle-db mkdir -p /assignment/Program4
          docker exec oracle-db mkdir -p /assignment/Program5

          docker cp Program1/solution.sql oracle-db:/assignment/Program1/solution.sql
          docker cp Program2/solution.sql oracle-db:/assignment/Program2/solution.sql
          docker cp Program3/solution.sql oracle-db:/assignment/Program3/solution.sql
          docker cp Program4/solution.sql oracle-db:/assignment/Program4/solution.sql
          docker cp Program5/solution.sql oracle-db:/assignment/Program5/solution.sql
          docker cp autograder.sql oracle-db:/assignment/autograder.sql

      - name: Verify Files
        run: |
          docker exec oracle-db ls -l /assignment/Program1/solution.sql
          docker exec oracle-db ls -l /assignment/Program2/solution.sql
          docker exec oracle-db ls -l /assignment/Program3/solution.sql
          docker exec oracle-db ls -l /assignment/Program4/solution.sql
          docker exec oracle-db ls -l /assignment/Program5/solution.sql
          docker exec oracle-db ls -l /assignment/autograder.sql

      - name: Run Program 1
        run: |
          docker exec oracle-db bash -c \
          "sqlplus -s collegeDB/CollegeDB123@FREEPDB1 @/assignment/Program1/solution.sql"

      - name: Run Program 2
        run: |
          docker exec oracle-db bash -c \
          "sqlplus -s collegeDB/CollegeDB123@FREEPDB1 @/assignment/Program2/solution.sql"

      - name: Run Program 3
        run: |
          docker exec oracle-db bash -c \
          "sqlplus -s collegeDB/CollegeDB123@FREEPDB1 @/assignment/Program3/solution.sql"

      - name: Run Program 4
        run: |
          docker exec oracle-db bash -c \
          "sqlplus -s collegeDB/CollegeDB123@FREEPDB1 @/assignment/Program4/solution.sql"

      - name: Run Program 5
        run: |
          docker exec oracle-db bash -c \
          "sqlplus -s collegeDB/CollegeDB123@FREEPDB1 @/assignment/Program5/solution.sql"

      - name: Run Autograder
        run: |
          docker exec oracle-db bash -c \
          "sqlplus -s collegeDB/CollegeDB123@FREEPDB1 @/assignment/autograder.sql" \
          2>&1 | tee autograder-output.txt

      - name: Check Result
        run: |
          cat autograder-output.txt

          if grep -q "RESULT: PASSED" autograder-output.txt; then
            echo "AUTOGRADING PASSED"
          else
            echo "AUTOGRADING FAILED"
            exit 1
          fi
